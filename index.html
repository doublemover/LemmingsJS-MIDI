<!DOCTYPE html>
<html lang="en">
<head>
  <title>Lemmings - Lemmings / Oh no! More Lemmings</title>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, user-scalable=0.0, viewport-fit=cover"/>
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="LemmingsJS" />
  <link rel="icon" type="image/png" href="img/favicon.png" />
  <link rel="shortcut icon" type="image/png" href="img/touch-icon-152.png" />
  <link rel="apple-touch-icon" href="img/touch-icon-152.png" />
  <link rel="apple-touch-icon" sizes="152x152" href="img/touch-icon-152.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="img/touch-icon-180.png" />
  <link rel="manifest" href="site.webmanifest" />
  <link type="text/css" rel="stylesheet" href="css/game.css">
  <script>
    if (navigator.webdriver) {
      const originalError = console.error;
      console.error = (...args) => {
        const message = args.map(arg => String(arg)).join(' ');
        if (message.includes('SSL certificate error occurred when fetching the script.')) {
          return;
        }
        originalError.apply(console, args);
      };
    }
  </script>
  <script type="text/javascript" src="js/vendor/jquery.js"></script>
  <script type="text/javascript" src="js/vendor/webmidi.js"></script>
  <script type="module" src="js/app/boot.js"></script>
</head>
<body oncontextmenu="return false;">
  <div id="controlLeft" class="control-panel left">
    <div class="panel-section panel-header">
      <div class="panel-title panel-toggle" id="midiPanelToggle">MIDI</div>
      <label class="panel-row midi-enable-row">
        <input type="checkbox" id="midiEnabledToggle" />
        MIDI enabled
      </label>
      <button id="midiDefaultsButton" type="button" class="button-danger">reset all</button>
    </div>
    <div class="panel-section panel-tabs">
      <div class="tabs" data-tab-group="midi-left">
        <button class="tab-button active" data-tab-group="midi-left" data-tab-target="midiTabLeft">MIDI</button>
        <button class="tab-button" data-tab-group="midi-left" data-tab-target="midiTabGlobalFx">Global FX</button>
      </div>
    </div>
    <div class="tab-panel active" id="midiTabLeft" data-tab-group="midi-left">
      <details class="panel-section" id="midiIoSection" data-section-key="io" open>
        <summary class="panel-title">I/O</summary>
        <label class="panel-row">
          Input
          <select id="midiInSelect"></select>
        </label>
        <label class="panel-row">
          Output
          <select id="midiOutSelect"></select>
        </label>
        <label class="panel-row">
          Input channel
          <select id="midiInputChannel"></select>
        </label>
        <button id="midiResetButton" type="button">MIDI reset</button>
        <label class="panel-row">
          <input type="checkbox" id="midiViewPanToggle" />
          View pan
        </label>
        <div id="errorDisplay" class="panel-error"></div>
      </details>
      <div class="panel-section">
        <div class="panel-title panel-title-row">
          <span>Base BPM</span>
          <input type="number" id="midiBpmBase" min="40" max="240" step="1" class="input-compact input-align-right" />
        </div>
        <div class="panel-row panel-row-wide">
          <span id="midiBpmCurrent">--</span>
        </div>
      </div>
    </div>
    <div class="tab-panel" id="midiTabGlobalFx" data-tab-group="midi-left">
      <div class="panel-section">
        <label class="panel-row range-row">
          <span>Intensity</span>
          <div class="range-input">
            <span class="range-label">10</span>
            <input type="range" id="midiIntensity" min="10" max="127" step="1" />
            <span class="range-label">127</span>
          </div>
        </label>
        <label class="panel-row range-row">
          <span>Accent</span>
          <div class="range-input">
            <span class="range-label">0</span>
            <input type="range" id="midiAccent" min="0" max="1" step="0.01" />
            <span class="range-label">1</span>
          </div>
        </label>
      </div>
      <details class="panel-section" id="midiPositionSection" data-section-key="position" open>
        <summary class="panel-title">Positional Modifiers</summary>
        <div class="panel-row">
          <span>Position mappings</span>
          <button id="midiPositionAdd" type="button">Add mapping</button>
        </div>
        <div id="midiPositionList"></div>
      </details>
      <details class="panel-section" id="midiRepeatSection" data-section-key="repeat" open>
        <summary class="panel-title panel-title-row">
          <span>Global Repeat</span>
          <label class="panel-title-toggle">
            <span>Enabled</span>
            <input type="checkbox" id="midiRepeatEnabled" />
          </label>
        </summary>
        <label class="panel-row">
          Repeat max count
          <input type="number" id="midiRepeatCount" min="0" max="32" step="1" />
        </label>
        <label class="panel-row">
          Repeat window (beats)
          <select id="midiRepeatSpacing"></select>
        </label>
        <label class="panel-row">
          Repeat target
          <select id="midiRepeatTarget"></select>
        </label>
        <label class="panel-row range-row">
          <span>Repeat amount</span>
          <div class="range-input">
            <span class="range-label">-1</span>
            <input type="range" id="midiRepeatAmount" min="-1" max="1" step="0.05" />
            <span class="range-label">1</span>
          </div>
        </label>
      </details>
    </div>
  </div>
  <div id="controlRight" class="control-panel right">
    <div class="tabs" data-tab-group="midi-right">
      <button class="tab-button active" data-tab-group="midi-right" data-tab-target="midiTabEvents">Events</button>
      <button class="tab-button" data-tab-group="midi-right" data-tab-target="midiTabTriggers">Triggers</button>
      <button class="tab-button" data-tab-group="midi-right" data-tab-target="midiTabAdsr">ADSR</button>
    </div>
    <div class="tab-panel active" id="midiTabEvents" data-tab-group="midi-right">
      <div class="panel-section">
        <div class="panel-title">Key and scale</div>
        <label class="panel-row">
          Key
          <select id="midiKeySelect"></select>
        </label>
        <label class="panel-row">
          Scale
          <select id="midiScaleSelect"></select>
        </label>
      </div>
      <div id="midiEventList"></div>
    </div>
    <div class="tab-panel" id="midiTabTriggers" data-tab-group="midi-right">
      <div id="midiTriggerList"></div>
    </div>
    <div class="tab-panel" id="midiTabAdsr" data-tab-group="midi-right">
      <div class="panel-section">
        <div class="panel-title">Envelope</div>
        <label class="panel-row">
          Target
          <select id="midiEnvTarget"></select>
        </label>
        <label class="panel-row range-row">
          <span>Attack</span>
          <div class="range-input">
            <span class="range-label">0</span>
            <input type="range" id="midiEnvAttack" min="0" max="2" step="0.05" />
            <span class="range-label">2</span>
          </div>
        </label>
        <label class="panel-row range-row">
          <span>Decay</span>
          <div class="range-input">
            <span class="range-label">0</span>
            <input type="range" id="midiEnvDecay" min="0" max="1" step="0.05" />
            <span class="range-label">1</span>
          </div>
        </label>
        <label class="panel-row range-row">
          <span>Sustain</span>
          <div class="range-input">
            <span class="range-label">0.25</span>
            <input type="range" id="midiEnvSustain" min="0.25" max="2" step="0.05" />
            <span class="range-label">2</span>
          </div>
        </label>
        <label class="panel-row range-row">
          <span>Release</span>
          <div class="range-input">
            <span class="range-label">0</span>
            <input type="range" id="midiEnvRelease" min="0" max="2" step="0.05" />
            <span class="range-label">2</span>
          </div>
        </label>
      </div>
    </div>
  </div>
  <div id="etc" style="color:#fff; position: absolute; bottom:0; left: 0;">
    <a style="color:#0f0;" href="https://github.com/doublemover/LemmingsJS-MIDI/">Github Repo</a>
    <span style="color:#0f0; padding: 0 6px;">|</span>
    <a style="color:#0f0;" href="editor.html">Editor</a>
  </div>
  <div class="game">
    <div class="game_container">
      <canvas height="480" width="800" id="gameCanvas" class="gameCanvas"></canvas>
      <div id="levelSelects" class="level_name">
        <select id="gameTypeSelect"></select>
        <select id="levelGroupSelect"></select>
        <select id="levelIndexSelect"></select>
        <div class="saved-level-controls">
          <span class="saved-level-label">Saved</span>
          <select id="savedLevelSelect"></select>
          <button id="savedLevelSave" type="button">Save</button>
          <button id="savedLevelExport" type="button">Export</button>
          <button id="savedLevelImport" type="button">Import</button>
          <input id="savedLevelImportInput" type="file" accept=".nxlv" />
        </div>
      </div>
      <span id="levelName" class="level_name"></span>
      <img class="arrow_l" src="img/arrow_l.png" width="37" height="58" onclick="lemmings.moveToLevel(-1)"/>
      <img class="arrow_r" src="img/arrow_r.png" width="37" height="58" onclick="lemmings.moveToLevel(1)"/>
    </div>
  </div>
  <script>
    if (!navigator.webdriver) {
      const statsPixel = document.createElement('img');
      statsPixel.src = 'https://sneakyness.com/stats/lemmings-MIDI';
      statsPixel.alt = '';
      statsPixel.style.display = 'none';
      document.body.appendChild(statsPixel);
    }
  </script>
</body>
</html>
