<!DOCTYPE html>
<html lang="en">
<head>
  <title>Lemmings - Lemmings / Oh no! More Lemmings</title>
  <meta charset="UTF-8" />
  <meta name="lemmings-analytics" content="runtime" />
  <meta name="lemmings-analytics-endpoint" content="" />
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, user-scalable=0.0, viewport-fit=cover"/>
  <meta name="description" content="Classic Lemmings reimplementation with WebMIDI controls, editor, and E2E harness." />
  <meta property="og:title" content="LemmingsJS-MIDI" />
  <meta property="og:description" content="Classic Lemmings reimplementation with WebMIDI controls, editor, and E2E harness." />
  <meta property="og:image" content="https://github.com/user-attachments/assets/291d0c6a-ca2e-4de1-bee7-5c0cfb169ae9" />
  <meta property="og:url" content="https://github.com/doublemover/LemmingsJS-MIDI" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="LemmingsJS-MIDI" />
  <meta name="twitter:description" content="Classic Lemmings reimplementation with WebMIDI controls, editor, and E2E harness." />
  <meta name="twitter:image" content="https://github.com/user-attachments/assets/291d0c6a-ca2e-4de1-bee7-5c0cfb169ae9" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="LemmingsJS" />
  <link rel="icon" type="image/png" href="img/favicon.png" />
  <link rel="shortcut icon" type="image/png" href="img/touch-icon-152.png" />
  <link rel="apple-touch-icon" href="img/touch-icon-152.png" />
  <link rel="apple-touch-icon" sizes="152x152" href="img/touch-icon-152.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="img/touch-icon-180.png" />
  <link rel="manifest" href="site.webmanifest" />
  <link type="text/css" rel="stylesheet" href="css/game.css">
  <script>
    if (navigator.webdriver) {
      const originalError = console.error;
      console.error = (...args) => {
        const message = args.map(arg => String(arg)).join(' ');
        if (message.includes('SSL certificate error occurred when fetching the script.')) {
          return;
        }
        originalError.apply(console, args);
      };
    }
  </script>
  <script type="text/javascript" src="js/vendor/webmidi.js"></script>
  <script type="module" src="js/app/boot.js"></script>
</head>
<body oncontextmenu="return false;">
  <div id="midiSequencerWorkspace" class="midi-sequencer" aria-label="MIDI sequencer workspace">
    <div id="midiTransportStrip" class="midi-transport">
      <div class="midi-transport__title">MIDI Sequencer</div>
      <label class="midi-field midi-field--toggle">
        <span>Enable</span>
        <input type="checkbox" id="midiEnabledToggle" />
      </label>
      <label class="midi-field">
        <span>Input</span>
        <select id="midiInSelect"></select>
      </label>
      <label class="midi-field">
        <span>Output</span>
        <select id="midiOutSelect"></select>
      </label>
      <label class="midi-field midi-field--compact">
        <span>Channel</span>
        <select id="midiInputChannel"></select>
      </label>
      <label class="midi-field midi-field--compact">
        <span>BPM</span>
        <input type="number" id="midiBpmBase" min="40" max="240" step="1" />
      </label>
      <button id="midiProjectResetButton" type="button">Reset</button>
      <button id="midiPanicButton" type="button">Panic</button>
      <div id="midiProjectStatus" class="midi-status" role="status">Project loading</div>
      <div id="errorDisplay" class="midi-error" role="status"></div>
    </div>
    <div class="midi-workspace-grid">
      <section id="midiSourceBrowser" class="midi-region midi-source-browser" aria-label="MIDI source browser">
        <div class="midi-region__header">
          <h2>Sources</h2>
          <span id="midiSourceCount">0</span>
        </div>
        <label class="midi-field midi-field--stacked">
          <span>Search</span>
          <input id="midiSourceSearch" type="search" autocomplete="off" />
        </label>
        <div class="midi-filter-row">
          <select id="midiSourceKindFilter" aria-label="Source category">
            <option value="all">All categories</option>
            <option value="sfx">SFX</option>
            <option value="trigger">Triggers</option>
            <option value="midiFlag">MIDI flags</option>
            <option value="system">System</option>
            <option value="procgen">Procgen</option>
          </select>
          <select id="midiSourceAssignFilter" aria-label="Assignment filter">
            <option value="all">All sources</option>
            <option value="assigned">Assigned</option>
            <option value="unassigned">Unassigned</option>
            <option value="enabled">Enabled</option>
            <option value="disabled">Disabled</option>
            <option value="conflicts">Conflicts</option>
            <option value="clean">Clean</option>
          </select>
        </div>
        <div id="midiSourceList" class="midi-source-list" role="listbox" aria-label="Event sources"></div>
      </section>
      <section id="midiTrackWorkspace" class="midi-region midi-track-workspace" aria-label="MIDI tracks">
        <div class="midi-region__header">
          <h2>Tracks</h2>
          <button id="midiTrackAdd" type="button">Add</button>
        </div>
        <div id="midiTrackList" class="midi-track-list" role="listbox" aria-label="Project tracks"></div>
        <div id="midiClipLibrary" class="midi-clip-library">
          <div class="midi-region__header midi-region__header--compact">
            <h2>Clips</h2>
            <button id="midiClipAddButton" type="button">Add</button>
          </div>
          <div id="midiClipList" class="midi-clip-list" role="listbox" aria-label="Project clips"></div>
        </div>
        <div id="midiSelectedSourceSummary" class="midi-selection-summary">No source selected</div>
        <div class="midi-assignment-row">
          <select id="midiAssignTrackSelect" aria-label="Assign source to track"></select>
          <button id="midiAssignSourceButton" type="button">Assign Source</button>
        </div>
      </section>
      <section id="midiInspector" class="midi-region midi-inspector" aria-label="MIDI inspector">
        <div class="midi-region__header">
          <h2>Inspector</h2>
          <div class="midi-button-row">
            <button id="midiAuditionButton" type="button">Audition</button>
            <button id="midiClipAuditionButton" type="button">Clip</button>
          </div>
        </div>
        <div id="midiTrackInspector" class="midi-inspector-group">
          <h3>Track</h3>
          <label class="midi-field midi-field--stacked">
            <span>Name</span>
            <input id="midiTrackName" type="text" />
          </label>
          <label class="midi-field midi-field--stacked">
            <span>Instrument</span>
            <input id="midiTrackInstrument" type="text" />
          </label>
          <div class="midi-inline-fields">
            <label class="midi-field midi-field--compact">
              <span>Channel</span>
              <input id="midiTrackChannel" type="number" min="1" max="16" step="1" />
            </label>
            <label class="midi-field midi-field--compact">
              <span>Priority</span>
              <input id="midiTrackPriority" type="number" min="0" max="4" step="1" />
            </label>
            <label class="midi-field midi-field--compact">
              <span>Voices</span>
              <input id="midiTrackVoiceBudget" type="number" min="1" max="32" step="1" />
            </label>
            <label class="midi-field midi-field--compact">
              <span>Scale</span>
              <input id="midiTrackVelocityScale" type="number" min="0" max="4" step="0.05" />
            </label>
          </div>
          <div class="midi-toggle-row">
            <label><input id="midiTrackMute" type="checkbox" /> Mute</label>
            <label><input id="midiTrackSolo" type="checkbox" /> Solo</label>
            <label><input id="midiTrackArm" type="checkbox" /> Arm</label>
          </div>
        </div>
        <div id="midiSourceInspector" class="midi-inspector-group">
          <h3>Source</h3>
          <label class="midi-field midi-field--toggle">
            <span>Enabled</span>
            <input id="midiSourceEnabled" type="checkbox" />
          </label>
          <label class="midi-field midi-field--stacked">
            <span>Route</span>
            <select id="midiSourceTrackSelect"></select>
          </label>
          <div class="midi-inline-fields">
            <label class="midi-field midi-field--compact">
              <span>Mode</span>
              <select id="midiSourceModeSelect">
                <option value="direct">Direct</option>
                <option value="clip">Clip</option>
              </select>
            </label>
            <label class="midi-field midi-field--compact">
              <span>Clip</span>
              <select id="midiSourceClipSelect"></select>
            </label>
            <button id="midiAssignClipButton" type="button">Assign Clip</button>
          </div>
          <div id="midiConflictSummary" class="midi-conflict-summary" aria-live="polite">
            No conflicts for the selected source.
          </div>
          <div class="midi-toggle-row">
            <label><input id="midiEnvelopeOverrideToggle" type="checkbox" /> Envelope override</label>
          </div>
          <div class="midi-inline-fields">
            <label class="midi-field midi-field--compact">
              <span>Note</span>
              <input id="midiMappingNote" type="number" min="0" max="127" step="1" />
            </label>
            <label class="midi-field midi-field--compact">
              <span>Degree</span>
              <input id="midiMappingDegree" type="number" min="0" max="24" step="1" />
            </label>
            <label class="midi-field midi-field--compact">
              <span>Octave</span>
              <input id="midiMappingOctave" type="number" min="0" max="10" step="1" />
            </label>
          </div>
          <div class="midi-inline-fields">
            <label class="midi-field midi-field--compact">
              <span>Velocity</span>
              <input id="midiMappingVelocity" type="number" min="1" max="127" step="1" />
            </label>
            <label class="midi-field midi-field--compact">
              <span>Duration</span>
              <input id="midiMappingDuration" type="number" min="1" max="96" step="1" />
            </label>
            <label class="midi-field midi-field--compact">
              <span>Chord</span>
              <select id="midiMappingChord">
                <option value="">None</option>
                <option value="triad">Triad</option>
                <option value="seventh">Seventh</option>
                <option value="sixth">Sixth</option>
                <option value="ninth">Ninth</option>
                <option value="power">Power</option>
                <option value="sus2">Sus2</option>
                <option value="sus4">Sus4</option>
                <option value="octave">Octave</option>
              </select>
            </label>
          </div>
          <div class="midi-inline-fields">
            <label class="midi-field midi-field--compact">
              <span>Attack</span>
              <input id="midiEnvAttack" type="number" min="0" max="2" step="0.05" />
            </label>
            <label class="midi-field midi-field--compact">
              <span>Decay</span>
              <input id="midiEnvDecay" type="number" min="0" max="2" step="0.05" />
            </label>
            <label class="midi-field midi-field--compact">
              <span>Sustain</span>
              <input id="midiEnvSustain" type="number" min="0" max="2" step="0.05" />
            </label>
            <label class="midi-field midi-field--compact">
              <span>Release</span>
              <input id="midiEnvRelease" type="number" min="0" max="2" step="0.05" />
            </label>
          </div>
        </div>
        <div id="midiModulationInspector" class="midi-inspector-group">
          <div class="midi-region__header midi-region__header--compact">
            <h3>Modulation</h3>
            <button id="midiAutomationAddButton" type="button">Add Mod</button>
          </div>
          <div class="midi-inline-fields">
            <label class="midi-field midi-field--compact">
              <span>Intensity</span>
              <input id="midiGlobalIntensity" type="number" min="1" max="127" step="1" />
            </label>
            <label class="midi-field midi-field--compact">
              <span>Accent</span>
              <input id="midiGlobalAccent" type="number" min="0" max="4" step="0.05" />
            </label>
            <label class="midi-field midi-field--toggle midi-field--compact">
              <span>View Pan</span>
              <input id="midiGlobalViewPan" type="checkbox" />
            </label>
          </div>
          <div id="midiAutomationList" class="midi-automation-list" aria-label="Position modulation lanes"></div>
        </div>
        <div id="midiClipInspector" class="midi-inspector-group">
          <h3>Clip</h3>
          <div class="midi-inline-fields">
            <label class="midi-field midi-field--compact">
              <span>Name</span>
              <input id="midiClipName" type="text" />
            </label>
            <label class="midi-field midi-field--compact">
              <span>Type</span>
              <select id="midiClipType">
                <option value="stepPattern">Steps</option>
                <option value="chord">Chord</option>
                <option value="arp">Arp</option>
              </select>
            </label>
            <label class="midi-field midi-field--compact">
              <span>Steps</span>
              <input id="midiClipLengthSteps" type="number" min="1" max="32" step="1" />
            </label>
          </div>
          <div id="midiStepPatternGrid" class="midi-step-grid" role="grid" aria-label="Step pattern"></div>
        </div>
      </section>
      <section id="midiOutputStatus" class="midi-region midi-output-status" aria-label="MIDI output status">
        <div id="midiSchedulerPressure">Scheduler: idle</div>
        <div id="midiOutputLog" class="midi-output-log">No output yet</div>
      </section>
    </div>
  </div>
  <div id="etc" style="color:#fff; position: absolute; bottom:0; left: 0;">
    <a style="color:#0f0;" href="https://github.com/doublemover/LemmingsJS-MIDI/">Github Repo</a>
    <span style="color:#0f0; padding: 0 6px;">|</span>
    <a style="color:#0f0;" href="editor.html">Editor</a>
  </div>
  <div class="game">
    <div class="game_container">
      <canvas height="480" width="800" id="gameCanvas" class="gameCanvas"></canvas>
      <div id="levelSelects" class="level_name">
        <select id="gameTypeSelect"></select>
        <select id="levelGroupSelect"></select>
        <select id="levelIndexSelect"></select>
        <div class="saved-level-controls">
          <span class="saved-level-label">Saved</span>
          <select id="savedLevelSelect"></select>
          <button id="savedLevelSave" type="button">Save</button>
          <button id="savedLevelExport" type="button">Export</button>
          <button id="savedLevelImport" type="button">Import</button>
          <input id="savedLevelImportInput" type="file" accept=".nxlv" />
        </div>
      </div>
      <span id="levelName" class="level_name"></span>
      <img id="levelPrevButton" class="arrow_l" src="img/arrow_l.png" width="37" height="58"/>
      <img id="levelNextButton" class="arrow_r" src="img/arrow_r.png" width="37" height="58"/>
    </div>
  </div>
  <div id="shortcutOverlay" class="shortcut-overlay" aria-hidden="true">
    <div class="shortcut-overlay__panel" role="dialog" aria-modal="true">
      <div class="shortcut-overlay__header">
        <div class="shortcut-overlay__title">Game Shortcuts</div>
        <button type="button" class="shortcut-overlay__close">Close</button>
      </div>
      <div class="shortcut-overlay__content"></div>
    </div>
  </div>
</body>
</html>
