name: Node.js CI

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run provenance:check
      - name: Build source-bound CycloneDX SBOM
        run: npm run --silent provenance:sbom > runtime-sbom.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: runtime-sbom
          path: runtime-sbom.json
      - run: npm audit --audit-level=moderate
      - run: npx playwright install --with-deps chromium
      - name: Check changed-line whitespace
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --check "origin/${{ github.base_ref }}...HEAD"
          else
            git diff --check "${{ github.event.before }}...HEAD"
          fi
      - run: npm run check-undefined
      - run: npm run lint
      - run: npm run typecheck:critical
      - run: npm run release-readiness
      - run: npm run depcheck
      - run: npm run check-mcp-clients
      - run: npm run test-e2e:boundaries
      - run: npm run test-e2e:workstation:smoke
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: workstation-browser-receipts
          path: |
            .tmp/browser-category-selection.json
            .tmp/workstation-results.json
            .tmp/workstation-result-qualification.json
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: browser-boundary-failures
          path: test-results
          retention-days: 7
      - name: Create localhost HTTPS cert
        run: |
          mkdir -p certs
          openssl req -x509 -newkey rsa:2048 -nodes \
            -keyout certs/localhost-key.pem \
            -out certs/localhost.pem \
            -days 1 \
            -subj "/CN=localhost" \
            -addext "subjectAltName=DNS:localhost,IP:127.0.0.1"
      - name: Start HTTPS server
        run: |
          LEMMINGS_HTTP_OWNER="${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}:${GITHUB_JOB}" node "$GITHUB_WORKSPACE/node_modules/http-server/bin/http-server" --cors="*" -S -C certs/localhost.pem -K certs/localhost-key.pem -a 127.0.0.1 -p 8080 > "$RUNNER_TEMP/lemmings-http-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/lemmings-http-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}.pid"
          LEMMINGS_HTTP_PID="$(cat "$RUNNER_TEMP/lemmings-http-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}.pid")" node -e "const ensureOwned=()=>{try{process.kill(Number(process.env.LEMMINGS_HTTP_PID),0);}catch{process.exit(1);}}; const https=require('node:https'); const started=Date.now(); const tick=()=>{ensureOwned(); const req=https.get('https://localhost:8080/?e2e=1',{rejectUnauthorized:false},res=>{res.resume(); ensureOwned(); process.exit(res.statusCode===200?0:1);}); req.on('error',()=>{if(Date.now()-started>30000) process.exit(1); setTimeout(tick,500);});}; tick();"
      - run: npm run test-mcp-smoke
      - run: npm run bench-smoke
      - name: Stop HTTPS server
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/lemmings-http-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}.pid" ]; then
            server_pid=$(cat "$RUNNER_TEMP/lemmings-http-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}.pid")
            if [ -d "/proc/$server_pid" ]; then
              if grep -zFxq "LEMMINGS_HTTP_OWNER=${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}:${GITHUB_JOB}" "/proc/$server_pid/environ"; then
                kill "$server_pid"
              else
                echo "Server PID no longer identifies this job's HTTP server; leaving it untouched." >&2
                exit 1
              fi
            fi
          fi
      - run: npm run coverage
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage
          path: coverage

  native-midi-codec:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run qualify:native-midi-codec
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: native-midi-codec-${{ matrix.os }}
          path: .tmp/native-midi-codec-qualification.json
          if-no-files-found: error

  lifecycle-engines:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: Prepare virtual audio output
        run: |
          sudo apt-get update
          sudo apt-get install -y pulseaudio pulseaudio-utils
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=lemmings_ci
          pactl set-default-sink lemmings_ci
          pactl info
      - run: npm run test-e2e:lifecycle
        env:
          LEMMINGS_LIFECYCLE_AUDIO_BACKEND: pulseaudio-null-sink
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: lifecycle-engine-receipts
          path: |
            .tmp/lifecycle-engine-results.json
            .tmp/lifecycle-engine-qualification.json
          if-no-files-found: error
